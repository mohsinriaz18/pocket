<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your Pocket email</title></head>
<body style="margin:0;padding:32px 16px;background:#F5F3EA;color:#0D2A25;font-family:Arial,sans-serif;">
  <table role="presentation" style="max-width:480px;width:100%;margin:auto;border-collapse:collapse;background:#FCFBF6;border:1px solid #E1DED0;border-radius:20px;">
    <tr><td style="padding:32px;">
      <p style="font-size:28px;font-weight:bold;margin:0 0 24px;color:#0F5C4D;">Pocket</p>
      <h1 style="font-size:24px;line-height:30px;margin:0 0 16px;">Confirm your email</h1>
      <p style="font-size:16px;line-height:25px;">Enter this six-digit code in Pocket to finish creating your account.</p>
      <p style="font-size:36px;line-height:52px;font-weight:bold;letter-spacing:6px;text-align:center;background:#EAF3D2;border-radius:12px;padding:16px 8px;">{{ .Token }}</p>
      <p style="font-size:14px;line-height:22px;color:#667974;">Use the most recent code. Never share it with anyone. If you did not create a Pocket account, you can ignore this email.</p>
    </td></tr>
  </table>
</body>
</html>
