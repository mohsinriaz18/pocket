// Applied after Expo prebuild. Values are supplied by a single CI build step.
def requiredEnvironment = { String name ->
    def value = System.getenv(name)
    if (value == null || value.isEmpty()) {
        throw new GradleException("Missing Android signing configuration: " + name)
    }
    return value
}

android {
    signingConfigs {
        pocketUpload {
            storeFile file(requiredEnvironment("POCKET_ANDROID_KEYSTORE_PATH"))
            storePassword requiredEnvironment("ANDROID_KEYSTORE_PASSWORD")
            keyAlias requiredEnvironment("ANDROID_KEY_ALIAS")
            keyPassword requiredEnvironment("ANDROID_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.pocketUpload
        }
    }
}
